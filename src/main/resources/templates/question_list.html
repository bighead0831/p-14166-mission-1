<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>질문 목록</title>
  </head>
  <body>
    <h1>질문목록</h1>
    <table border="1">
      <thead>
        <tr>
          <th>번호</th>
          <th>제목</th>
          <th>작성일시</th>
        </tr>
      </thead>
      <tbody th:each="question : ${questionList}">
        <td th:text="${question.id}"></td>
        <td th:text="${question.subject}"></td>
        <td th:text="${question.createDate}"></td>
      </tbody>
    </table>
  </body>
</html>
